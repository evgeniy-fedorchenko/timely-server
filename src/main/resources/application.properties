spring.application.name=timely-server
app.version=@project.version@
spring.profiles.default=dev

# Jwt
timely.jwt.secret=${JWT_SECRET:default_secret_default_secret_default_secret}
timely.jwt.expiration-millis=${JWT_EXPIRATION_MS:3600000}

# Data storage
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.cache.jcache.config=classpath:ehcache.xml

# Hikari CP
spring.datasource.hikari.minimumIdle=3
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.connectionTimeout=10000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.leakDetectionThreshold=15000

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.liquibase.change-log=classpath:/db/changelog/changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate

# Executor
spring.threads.virtual.enabled=true
spring.task.execution.thread-name-prefix=vbase-

# Locale
spring.web.locale=en_US

# Actuator
management.endpoints.web.exposure.include=*

# Swagger
springdoc.api-docs.path=/swagger/v3/api-docs
springdoc.swagger-ui.path=/swagger/swagger-ui.html
springdoc.api-docs.version=openapi_3_0
springdoc.show-actuator=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
